[package]
name = "nacs-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
dav-server = "0.11.0"
libp2p = { version = "0.56.0", features = ["cbor", "macros", "mdns", "noise", "ping", "request-response", "tcp", "tokio", "yamux"] }
rusqlite = "0.40.1"
tokio = { version = "1.52.3", features = ["full"] }
hyper = { version = "1.10.1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
base64 = "0.21"
sha2 = "0.10"
crc32fast = "1.4"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
