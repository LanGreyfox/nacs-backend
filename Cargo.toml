[package]
name = "nacs-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
dav-server = "0.11.0"
libp2p = { version = "0.57.1", features = ["cbor", "macros", "mdns", "noise", "ping", "request-response", "tcp", "tokio", "yamux"] }
rusqlite = "0.41.1"
tokio = { version = "1.54.1", features = ["full"] }
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
base64 = "0.23.1"
crc32fast = "1.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
axum = "0.8.9"
tower-http = { version = "0.7.1", features = ["auth", "add-extension", "cors", "fs", "trace"] }
chrono = { version = "0.4.45", features = ["serde"] }
tracing = "0.1.44"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
